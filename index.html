<style>

<script>
/* ===== Grille mondiale : chaque case = 50 m réels à 46° de latitude ; son identifiant « i,j » est caché ===== */
const R = 6378137, CS = 50 / Math.cos(46 * Math.PI / 180), KEY = 'carnet-cepes-v4', O = 20037508.34;
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const pad = n => String(n).padStart(2, '0'), today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtD = d => new Date(d + 'T00:00').toLocaleDateString('fr-FR'), fmtW = g => g >= 1000 ? (g / 1000).toFixed(2).replace('.', ',') + ' kg' : Math.round(g) + ' g';
const toM = (lat, lng) => [R * lng * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
const toLL = (x, y) => [(2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI, x / R * 180 / Math.PI];
const idAt = (x, y) => Math.floor(x / CS) + ',' + Math.floor(y / CS);
const ctr = k => { const [i, j] = k.split(',').map(Number); return [(i + .5) * CS, (j + .5) * CS]; };
const blank = () => ({ name: '', note: '', ph: [], v: [] }), rec = c => c && (c.v.length || c.name || c.note || (c.ph && c.ph.length));
const cnt = c => c ? c.v.reduce((a, v) => a + v.n, 0) : 0;
let D = { cells: {}, avg: 150 }, sel = null, hereK = null, me = null, watch = null, pending = false, V = { cx: 0, cy: 0, mpp: 1500 };

/* ===== Sauvegarde ===== */
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Stockage plein : exportez vos données'); } }
function clean(c) { return { name: String(c?.name || ''), note: String(c?.note || ''), ph: (Array.isArray(c?.ph) ? c.ph : []).filter(p => p && /^[\w-]+$/.test(String(p.id))).map(p => ({ id: String(p.id), d: /^\d{4}-\d\d-\d\d$/.test(p.d) ? p.d : '' })), v: (Array.isArray(c?.v) ? c.v : []).filter(v => v && /^\d{4}-\d\d-\d\d$/.test(v.d)).map(v => ({ d: v.d, n: Math.max(0, Math.round(+v.n || 0)), w: Math.max(0, +v.w || 0), e: !!v.e, t: String(v.t || '') })) }; }
function mergeCell(k, c) {      // fusionne sans doublon (importer deux fois le même fichier ne double rien)
  c = clean(c); const a = D.cells[k] ||= blank(), sig = v => [v.d, v.n, Math.round(v.w), v.t].join('|'), have = new Set(a.v.map(sig));
  c.v.forEach(v => { if (!have.has(sig(v))) a.v.push(v); });
  c.ph.forEach(p => { if (!a.ph.some(x => x.id === p.id)) a.ph.push(p); });
  if (c.name && !a.name.split(' / ').includes(c.name)) a.name = a.name ? a.name + ' / ' + c.name : c.name;
  if (c.note && !a.note.includes(c.note)) a.note = a.note ? a.note + '\n' + c.note : c.note;
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.cells) { D = { cells: {}, avg: d.avg || 150 }; Object.entries(d.cells).forEach(([k, c]) => /^-?\d+,-?\d+$/.test(k) && (D.cells[k] = clean(c))); } } catch (e) {}
}

/* ===== Conversion des anciennes cartes (grille 10×14 posée sur une image satellite) ===== */
const TW = 768, TH = 1075;
function fromOld(maps) {
  let n = 0, merged = 0, skipped = 0;
  maps.forEach(m => {
    if (!m.geo || !m.cells) { if (m.cells && Object.keys(m.cells).length) skipped++; return; }
    const z = m.geo.z, N = 2 ** z * 256, sl = Math.sin(m.geo.lat * Math.PI / 180);
    const cx = (m.geo.lng + 180) / 360 * N, cy = (.5 - Math.log((1 + sl) / (1 - sl)) / (4 * Math.PI)) * N;
    Object.entries(m.cells).forEach(([k, c]) => {
      const mm = /^(\d+),(\d+)$/.exec(k); if (!mm || !rec(clean(c))) return;
      const wx = cx - TW / 2 + (+mm[1] + .5) * TW / 10, wy = cy - TH / 2 + (+mm[2] + .5) * TH / 14;
      const lng = wx / N * 360 - 180, lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * wy / N))) * 180 / Math.PI, [x, y] = toM(lat, lng), id = idAt(x, y);
      if (D.cells[id]) merged++; mergeCell(id, c); n++;
    });
  });
  return { n, merged, skipped };
}
function importData(d) {
  let msg;
  if (d && Array.isArray(d.maps)) { const r = fromOld(d.maps); msg = `${r.n} case(s) converties` + (r.merged ? `, ${r.merged} fusionnée(s) avec une voisine` : '') + (r.skipped ? ` · ${r.skipped} carte(s) sans coordonnées ignorée(s)` : ''); }
  else if (d && d.cells && d.geo) { const r = fromOld([d]); msg = r.n + ' case(s) converties'; }
  else if (d && d.cells && d.grid === 50) { Object.entries(d.cells).forEach(([k, c]) => mergeCell(k, c)); msg = 'Carnet importé';
    if (d.photos && typeof d.photos === 'object') Promise.all(Object.entries(d.photos).filter(([id, u]) => /^[\w-]+$/.test(id) && typeof u === 'string' && u.startsWith('data:image/')).map(([id, u]) => pPut(id, u).catch(() => {}))).then(() => renderPanel()); }
  else return toast('Fichier non reconnu');
  save(); fitData(); draw(); renderPanel(); toast('📂 ' + msg);
}

/* ===== Carte (canvas) : tuiles satellite + cases ===== */
const cv = $('#cv'), g = cv.getContext('2d'), tiles = new Map(); let raf = 0;
let gridOn = (() => { try { return localStorage.getItem('cartocepe-grid') !== '0'; } catch (e) { return true; } })();
const tileImg = (z, x, y) => {
  const k = z + '/' + x + '/' + y; let t = tiles.get(k);
  if (!t) { t = new Image(); t.onload = () => schedule(); t.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`; tiles.set(k, t); if (tiles.size > 400) tiles.delete(tiles.keys().next().value); }
  return t;
};
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
function draw() {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#2c4a28'; g.fillRect(0, 0, W, H);
  const mpp = V.mpp, x0 = V.cx - W / 2 * mpp, x1 = V.cx + W / 2 * mpp, y0 = V.cy - H / 2 * mpp, y1 = V.cy + H / 2 * mpp;
  const sx = x => (x - V.cx) / mpp + W / 2, sy = y => H / 2 - (y - V.cy) / mpp;
  const Z = Math.max(3, Math.min(19, Math.ceil(Math.log2(156543.03392 / mpp)))), span = 256 * 156543.03392 / 2 ** Z, ts = span / mpp, lim = 2 ** Z - 1;
  for (let ty = Math.max(0, Math.floor((O - y1) / span)); ty <= Math.min(lim, Math.floor((O - y0) / span)); ty++)
    for (let tx = Math.max(0, Math.floor((x0 + O) / span)); tx <= Math.min(lim, Math.floor((x1 + O) / span)); tx++) {
      const im = tileImg(Z, tx, ty); if (im.complete && im.naturalWidth) g.drawImage(im, sx(tx * span - O), sy(O - ty * span), ts + .6, ts + .6);
    }
  if (commOn) drawComm(0, sx, sy, W, x0, x1, y0, y1, mpp);
  const px = CS / mpp, i0 =Math.floor(x0 / CS), i1 = Math.floor(x1 / CS), j0 = Math.floor(y0 / CS), j1 = Math.floor(y1 / CS);
  if (gridOn && px >= 12 && (i1 - i0) * (j1 - j0) < 4000) {
    g.strokeStyle = 'rgba(255,255,255,.42)'; g.lineWidth = 1; g.beginPath();
    for (let i = i0; i <= i1 + 1; i++) { const x = Math.round(sx(i * CS)) + .5; g.moveTo(x, 0); g.lineTo(x, H); }
    for (let j = j0; j <= j1 + 1; j++) { const y = Math.round(sy(j * CS)) + .5; g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  Object.entries(D.cells).forEach(([k, c]) => {
    if (!rec(c)) return; const [i, j] = k.split(',').map(Number); if (i < i0 || i > i1 || j < j0 || j > j1) return;
    const x = sx(i * CS), y = sy((j + 1) * CS), n = cnt(c);
    if (px < 10) {      // très dézoomé : pastille de taille fixe pour ne jamais perdre une case
      const cx = x + px / 2, cy = y + px / 2; g.beginPath(); g.arc(cx, cy, n ? 9 : 5, 0, 7); g.fillStyle = n ? '#d4a94a' : 'rgba(255,255,255,.85)'; g.fill();
      g.lineWidth = 2; g.strokeStyle = '#3b2412'; g.stroke(); if (n) { g.font = '11px serif'; g.fillStyle = '#000'; g.fillText('🍄', cx, cy + 1); } return;
    }
    g.fillStyle = n ? `rgba(212,169,74,${Math.min(.8, .3 + n * .08)})` : 'rgba(255,255,255,.18)'; g.fillRect(x, y, px, px);
    if (px >= 10) { const big = n && px >= 22; g.font = `${Math.min(px * (big ? .5 : .7), 44)}px serif`; g.fillText('🍄', x + px / 2, y + px * (big ? .36 : .52)); }
    if (px >= 22) { g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 3; g.font = `700 ${Math.max(11, px * .26)}px monospace`;
      if (n) { g.strokeText(n, x + px / 2, y + px * .72); g.fillText(n, x + px / 2, y + px * .72); }
      if (c.name && px >= 60) { g.font = '700 11px monospace'; const t = c.name.length > 14 ? c.name.slice(0, 13) + '…' : c.name; g.strokeText(t, x + px / 2, y + px - 9); g.fillText(t, x + px / 2, y + px - 9); } }
  });
  if (commOn) drawComm(1, sx, sy, W, x0, x1, y0, y1, mpp);
  const box = (k, col, w) => { const [i, j] = k.split(',').map(Number); g.strokeStyle = col; g.lineWidth = w; g.strokeRect(sx(i * CS) + w / 2, sy((j + 1) * CS) + w / 2, px - w, px - w); };

function drawComm(pass, sx, sy, W, x0, x1, y0, y1, mpp) {
  const vis = [...comm.values()].filter(c => c.bb[2] >= x0 && c.bb[0] <= x1 && c.bb[3] >= y0 && c.bb[1] <= y1); if (!vis.length) return;

const scanSoon = () => { clearTimeout(scanT); scanT = setTimeout(scan, 600); };
async function scan() {      // télécharge les communes qui couvrent l'écran (un point d'échantillonnage = une requête, seulement si pas déjà couvert)

      const add = (x, y) => { const key = Math.round(x / 400) + ',' + Math.round(y / 400), t = failed.get(key); if (seen.has(key) || (t && Date.now() - t < 6e4) || covered(x, y)) return; seen.add(key); pts.push({ x, y, key }); };

        try { const [la, lo] = toLL(p.x, p.y), r = await fetch(`https://geo.api.gouv.fr/communes?lat=${la.toFixed(5)}&lon=${lo.toFixed(5)}&fields=nom,code&format=geojson&geometry=contour`);

}

const rnd = a => a[Math.floor(Math.random() * a.length)];
const dsince = d => Math.round((new Date(today() + 'T00:00') - new Date(d + 'T00:00')) / 864e5);
const cl = (k, c) => c && c.name ? `« ${c.name} »` : 'la case ' + toLL(...ctr(k)).map(x => x.toFixed(3)).join(', ');
const infos = () => Object.entries(D.cells).filter(([k, c]) => rec(c)).map(([k, c]) => ({ k, c, n: cnt(c), last: c.v.filter(v => v.n > 0).reduce((a, v) => v.d > a ? v.d : a, '') }));
async function tipWx() {
  const best = infos().filter(x => x.n > 0).sort((a, b) => b.n - a.n)[0], k = sel || hereK || best?.k || idAt(V.cx, V.cy), c = D.cells[k], [la, lo] = toLL(...ctr(k));

  if (t0.score >= 50) o.push(`🌟 Conditions favorables aujourd'hui pour ${w} (indice ${t0.score}/100) : bonne sortie en vue !`);
  if (b.score >= 30 && b !== t0) o.push(`🎯 Meilleur jour à venir pour ${w} : ${day(b.date)} (indice ${b.score}/100).`);

  if (past < 10) o.push(`☀️ Seulement ${Math.round(past)} mm de pluie en 14 jours : le sol est sec, il faut environ 30 mm pour relancer la poussée.`);
  if (past >= 40) o.push(`🌧️ ${Math.round(past)} mm de pluie en 14 jours : de quoi déclencher une belle poussée, comptez 7 à 12 jours après les averses.`);

const tipGens = [
  () => ({ t: rnd(KB) }), () => ({ t: rnd(KB) }), () => ({ t: rnd(KB) }),
  () => infos().length ? null : { t: `🍄 Enregistrez votre première trouvaille avec « Trouvé ici ! » : l'appli pourra ensuite vous conseiller selon vos zones.` },
  () => { const a = infos().filter(x => x.n > 0).sort((x, y) => y.n - x.n)[0]; return a && { t: `🏆 ${cl(a.k, a.c)} est votre case la plus fructueuse : ${a.n} cèpe(s) en ${a.c.v.length} visite(s). Repassez-y après les prochaines pluies.`, k: a.k }; },
  () => { const a = infos().filter(x => x.last && dsince(x.last) < 8); if (!a.length) return null; const x = rnd(a), s = dsince(x.last); return { t: `⏳ ${cl(x.k, x.c)} a été récoltée ${s <= 0 ? `aujourd'hui` : 'il y a ' + s + ' j'} : laissez-lui encore ~${Math.max(1, 8 - s)} jour(s) pour se regarnir.`, k: x.k }; },

  () => { const vs = infos().flatMap(x => x.c.v).filter(v => v.n > 0 && !v.e), n = vs.reduce((a, v) => a + v.n, 0); if (n < 3) return null; const avg = vs.reduce((a, v) => a + v.w, 0) / n; return Math.abs(avg - D.avg) / D.avg > .25 ? { t: `⚖️ Vos cèpes pesés font ${Math.round(avg)} g en moyenne, contre ${D.avg} g réglés dans le menu : ajustez « Poids moyen » pour des estimations plus justes.` } : null; },

  tipWx, tipWx
];
