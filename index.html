/* ===== Refonte graphique : plus lisible, plus aéré, panneau compact sans défilement ===== */
:root{--forest:#2f5233;--wood:#7a5230;--dark:#33210f;--leather:#a8783c;--parch:#fbf5e4;--ink:#2b2112;--gold:#e3b64a}

.bar h1{font-size:16px;letter-spacing:.3px;text-shadow:0 1px 0 var(--dark)}
.ib{border-radius:12px;border:2px solid rgba(0,0,0,.55);box-shadow:0 2px 0 rgba(0,0,0,.5)}

#panel{margin:0 6px 6px;padding:8px 10px 6px;max-height:none;overflow:visible;background:var(--parch);border-radius:16px;box-shadow:0 -2px 12px rgba(0,0,0,.28);border:2px solid var(--wood)}

/* ===== Grille mondiale : chaque case = 50 m réels à 46° de latitude ; son identifiant « i,j » est caché ===== */

/* ===== Conversion des anciennes cartes (grille 10×14 posée sur une image satellite) ===== */
const TW = 768, TH = 1075;
function fromOld(maps) {

  maps.forEach(m => {
    if (!m.geo || !m.cells) { if (m.cells && Object.keys(m.cells).length) skipped++; return; }

/* ===== Carte (canvas) : tuiles satellite + cases ===== */
const cv = $('#cv'), g = cv.getContext('2d'), tiles = new Map(); let raf = 0;
let gridOn = (() => { try { return localStorage.getItem('cartocepe-grid') !== '0'; } catch (e) { return true; } })();
const TURL = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;

let tputN = 0;
/* p = tuile « épinglée » (téléchargée pour le hors connexion) : jamais purgée. Une tuile ordinaire n'écrase pas une tuile existante (add), donc ne retire jamais l'épingle. */
const tput = async (k, b, p) => { const db = await tdbP; if (!db) return false; return new Promise(res => { try {
  const tr = db.transaction('t', 'readwrite'), st = tr.objectStore('t'), rec = p ? { b, t: Date.now(), p: 1 } : { b, t: Date.now() };

const tileImg = (z, x, y) => {      // cache d'abord ; sinon UNE seule requête (fetch → blob → cache + affichage) ; repli direct si CORS/erreur

  if (!t) { t = new Image(); tiles.set(k, t); if (tiles.size > 400) tiles.delete(tiles.keys().next().value);

function drawTile(Z, tx, ty, dx, dy, ds) {
  const im = tileImg(Z, tx, ty);

const FURL = (z, x, y) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=IGNF_MASQUE-FORET.2021-2023&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX=${z}&TILEROW=${y}&TILECOL=${x}`;

/* Part de forêt d'une case (0 à 1) : 9 points échantillonnés dans le masque forêt (tuile zoom 17). 0 si indisponible. */
async function forestFrac(k) {
  try { const [x, y] = ctr(k), z = 17, span = 256 * 156543.03392 / 2 ** z, h = CS / 3, pts = [];
    for (const dx of [-h, 0, h]) for (const dy of [-h, 0, h]) { const u = (x + dx + O) / span, v = (O - (y + dy)) / span, tx = Math.floor(u), ty = Math.floor(v); pts.push([tx, ty, Math.min(255, Math.floor((u - tx) * 256)), Math.min(255, Math.floor((v - ty) * 256))]); }

/* Peuplements peu propices aux cèpes, grisés sur la carte (BD Forêt v2 IGN) : pin maritime pur, peupleraies, robiniers, eucalyptus, landes, coupes, plantations…

/* ===== Points précis : chaque trouvaille a ses coordonnées exactes (plus de cases) ===== */
function newSpot(x, y) { const k = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); D.cells[k] = { ...blank(), x, y }; return k; }
function nearestSpot(x, y, m) { let best = null, bd = m; Object.entries(D.cells).forEach(([k, c]) => { if (!rec(c) || c.x == null) return; const d = rdist([x, y], [c.x, c.y]); if (d < bd) { bd = d; best = k; } }); return best; }

  Object.entries(D.cells).forEach(([k, c]) => { if (!rec(c) || c.x == null) return; const d = Math.hypot(px - ((c.x - V.cx) / V.mpp + W / 2), py - (H / 2 - (c.y - V.cy) / V.mpp - ps / 2)); if (d < bd) { bd = d; best = k; } });

}
function target() { if (me) { const near = sel && D.cells[sel] && rdist(ctr(sel), [me.x, me.y]) < 40; return near ? [sel, null] : [hereK, [me.x, me.y]]; } return [sel, null]; }
function longSpot(px, py) {      // appui long sur la carte : pose un point exactement là
  const r = cv.getBoundingClientRect(), snap = JSON.stringify(D), k = newSpot(V.cx + (px - r.left - r.width / 2) * V.mpp, V.cy - (py - r.top - r.height / 2) * V.mpp);
  save(); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} select(k); toast('\ud83d\udccd Point pos\u00e9 ici : nommez-le ou ajoutez une visite', () => { restoreSnap(snap); save(); draw(); renderPanel(); });
}
function navTxt(k) {
  const [x, y] = ctr(k), [la, lo] = toLL(x, y); if (!me) return '\ud83d\udccd ' + la.toFixed(5) + ', ' + lo.toFixed(5) + ' \u00b7 activez \ud83d\udccd pour \u00eatre guid\u00e9';
  const d = rdist([x, y], [me.x, me.y]); if (d < 4) return '\ud83c\udfaf Vous y \u00eates (\u00b1' + Math.round(me.acc) + ' m)';
  const i = Math.round(((Math.atan2(x - me.x, y - me.y) * 180 / Math.PI + 360) % 360) / 45) % 8;
  return '\ud83e\udded <b>' + (d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km') + '</b> ' + ['\u2191', '\u2197', '\u2192', '\u2198', '\u2193', '\u2199', '\u2190', '\u2196'][i] + ' ' + ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ouest', 'ouest', 'nord-ouest'][i] + ' (\u00b1' + Math.round(me.acc) + ' m)';
}
function navLine(k) { return ''; }
function updNav() { const e = $('#nvt'); if (e && sel && D.cells[sel]) e.innerHTML = navTxt(sel); }
/* ===== Tap : 1 = action, 2 = zoom doux à l'endroit touché, 3 = dézoom doux ===== */
function onTap(e) { const r = cv.getBoundingClientRect(); const pt = spotAt(e.clientX - r.left, e.clientY - r.top), mk = markAt(e.clientX - r.left, e.clientY - r.top); if (RM) { if (mk) openMark(mk.id); else openMk({ id: null, t: mkLast, note: '', x: V.cx + (e.clientX - r.left - r.width / 2) * V.mpp, y: V.cy - (e.clientY - r.top - r.height / 2) * V.mpp, where: 'tap' }); } else if (P.on) pathTap(e.clientX - r.left, e.clientY - r.top); else if (pt && pt !== sel) { select(pt); flyTo(pt); } else if (sel) { sel = null; collapse(); renderPanel(); draw(); } }
var TT = { t: 0, n: 0, x: 0, y: 0, timer: 0 };
function multiTap(e) {
  const now = performance.now(), same = now - TT.t < 330 && Math.hypot(e.clientX - TT.x, e.clientY - TT.y) < 36;
  TT.n = same ? TT.n + 1 : 1; TT.t = now; TT.x = e.clientX; TT.y = e.clientY; clearTimeout(TT.timer);
  if (TT.n === 1) { const ev = { clientX: e.clientX, clientY: e.clientY }; TT.timer = setTimeout(() => onTap(ev), 300); }      // l'action d'un tap simple attend de savoir s'il y en a d'autres
  else if (TT.n === 2) zoomSmooth(2.6, e.clientX, e.clientY);
  else { zoomSmooth(1 / 3.2, e.clientX, e.clientY); TT.n = 0; }
}
function zoomSmooth(f, px, py) {      // zoom animé qui garde le point touché sous le doigt
  const r = cv.getBoundingClientRect(), dx = px - r.left - r.width / 2, dy = py - r.top - r.height / 2, ox = V.cx + dx * V.mpp, oy = V.cy - dy * V.mpp;
  const m0 = V.mpp, m1 = Math.min(3000, Math.max(.3, m0 / f)), t0 = performance.now(), id = ++fly;
  const step = now => { if (id !== fly) return; const p = Math.min(1, (now - t0) / 320), e = 1 - (1 - p) ** 3, m = Math.exp(Math.log(m0) + (Math.log(m1) - Math.log(m0)) * e);
    V.mpp = m; V.cx = ox - dx * m; V.cy = oy + dy * m; draw(); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
renderPanel(); draw();
